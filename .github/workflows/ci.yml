name: CI

# Portão de qualidade: lint + migrations + testes do back-end e build dos dois fronts.
#
# Roda em duas situações, e por isso tem `workflow_call`:
#   1. em todo pull request para `develop` (homolog) ou `main` (produção), como status
#      check antes do merge;
#   2. **chamado de dentro** das esteiras de deploy (`deploy-homolog.yml` e
#      `deploy-producao.yml`), que só publicam se ele passar.
#
# Não há gatilho de `push` aqui: numa branch de deploy quem roda o CI é a esteira, e
# duplicar o gatilho faria a mesma suíte rodar duas vezes por push, competindo por runner.
# Ver `docs/pipelines.md`.
on:
  pull_request:
    branches: [main, develop]
  workflow_call:

# Cancela execuções antigas do mesmo ref para não acumular jobs concorrentes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend — testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tiescolar
          POSTGRES_PASSWORD: tiescolar
          POSTGRES_DB: tiescolar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tiescolar -d tiescolar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # O MinIO **não** é service container: ele sobe num passo, logo abaixo. `services:`
      # não deixa passar comando à imagem, e a imagem oficial do MinIO precisa de
      # `server /data`. Era por isso que aqui havia `minio/minio:edge-cicd`, a tag que já
      # subia o servidor sozinha — e em 20/set/2026 o Docker Hub passou a recusá-la
      # (`pull access denied for minio/minio`), deixando **todo PR vermelho**.

    env:
      DATABASE_URL: postgresql+psycopg://tiescolar:tiescolar@localhost:5432/tiescolar
      S3_ENDPOINT_URL: http://localhost:9000
      S3_BUCKET_DOCUMENTOS: ti-escolar-docs
      AWS_REGION: sa-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin

    steps:
      - uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instala dependências
        run: pip install -e ".[dev,llm,s3]"

      - name: Lint (ruff)
        run: ruff check app tests

      # Duas branches que criem uma migration a partir do mesmo head produzem **multiple
      # heads**, e o sintoma só aparece depois do merge — no `alembic upgrade head` do CMD
      # do container, ou seja, durante o deploy. Renumerar o arquivo NÃO resolve: o grafo é
      # definido pelo `down_revision`, não pelo nome. Esta checagem antecipa a falha para o
      # PR, com mensagem dizendo o que fazer.
      - name: Cadeia de migrations linear (um head só)
        run: |
          heads=$(alembic heads | grep -c . || true)
          if [ "$heads" -ne 1 ]; then
            echo "::error::Existem $heads heads de migration. Re-aponte o down_revision da"
            echo "::error::migration mais nova para o head atual da main (cadeia linear)."
            alembic heads
            exit 1
          fi

      - name: Migrations (alembic upgrade head)
        run: alembic upgrade head

      # O seed é código que só roda contra um banco, então pytest não o cobre — e ele
      # quebrou em silêncio quando a ficha de matrícula ganhou campos obrigatórios
      # (PR #51), aparecendo só no `docker compose up` de quem foi rodar o projeto.
      # Aqui já existe Postgres e schema; rodá-lo custa segundos.
      - name: Seed de demonstração (fuma contra o banco)
        env:
          SEED_DEMO: "true"
          APP_ENV: development
        run: python -m app.seed

      # S3 de verdade para o adaptador (§0.6 do plano de 10/08). Sem isto, os testes de
      # `S3ArquivoStorage` pulam sozinhos e o adaptador chegaria a produção sem nunca ter
      # escrito um byte — que é exatamente o impasse que o deixou anos no papel.
      # Imagem do quay.io, que é onde a MinIO publica, e **tag fixa**: `latest` quebraria o
      # CI num dia qualquer, sem commit nenhum, que é a falha que se está consertando aqui.
      - name: Sobe o MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null 2>&1; then
              echo "MinIO pronto"; exit 0
            fi
            sleep 2
          done
          echo "::error::MinIO não respondeu ao health em 60s"
          docker logs minio
          exit 1

      - name: Cria o bucket do MinIO
        run: |
          python - <<'PY'
          import boto3
          c = boto3.client(
              "s3", endpoint_url="http://localhost:9000", region_name="sa-east-1",
              aws_access_key_id="minioadmin", aws_secret_access_key="minioadmin",
          )
          try:
              c.create_bucket(Bucket="ti-escolar-docs")
          except c.exceptions.BucketAlreadyOwnedByYou:
              pass
          print("bucket pronto")
          PY

      - name: Testes (pytest)
        run: pytest -q

  web:
    name: Painel (web) — typecheck e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Configura Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` (e não `install`): respeita o lockfile, então o CI valida exatamente as
      # versões que o deploy vai instalar (Vercel no homolog, Cloudflare Pages na
      # produção).
      - name: Instala dependências
        run: npm ci

      # O build já faz checagem de tipos, mas o `tsc` isolado falha mais rápido e com
      # mensagem melhor — e cobre arquivos que o build não chega a incluir.
      - name: Typecheck (tsc)
        run: npx tsc --noEmit

      - name: Build (next build)
        run: npm run build
        env:
          # A URL real vem do ambiente de deploy; aqui só precisa existir para o build.
          NEXT_PUBLIC_API_URL: http://localhost:8000

  site:
    name: Landing page (site) — typecheck e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site

    steps:
      - uses: actions/checkout@v4

      - name: Configura Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Instala dependências
        run: npm ci

      - name: Typecheck (tsc)
        run: npm run typecheck

      # Export estático: se quebrar aqui, o deploy na Cloudflare Pages quebraria depois —
      # com a diferença de que ali o erro só aparece no push para a main.
      - name: Build (export estático)
        run: npm run build
