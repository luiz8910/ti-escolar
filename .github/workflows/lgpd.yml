name: LGPD — postura do ambiente

# Este workflow mede **configuração**, e só isso. O código é o mesmo em todo ambiente; o que
# muda é a CONFIGURAÇÃO, e ela muda por fora do git — alguém edita uma env var no painel do
# Render e nenhum commit registra. É determinístico, sem LLM e sem credencial
# (scripts/postura_ambiente.py): custo zero e resultado repetível.
#
# **RODA SÓ QUANDO ALGUÉM MANDA** (17/ago/2026). Saíram o gatilho por push na main e o cron
# semanal: nenhuma verificação de LGPD acontece por conta própria neste projeto, por decisão
# do responsável, até que exista um plano de execuções definido. O script continua aqui e
# continua rodável — pela aba Actions ("Run workflow") ou direto no terminal:
#
#     python scripts/postura_ambiente.py --base-url https://...
#
# **O que se perde, dito em voz alta:** a configuração muda por fora do git, então sem
# gatilho uma regressão (alguém desliga META_VALIDATE_SIGNATURE no painel do Render) só é
# descoberta quando alguém for olhar. Era exatamente essa janela que o cron cobria.
#
# **A auditoria do código por LLM não mora mais aqui** (13/ago/2026). O agente
# `lgpd-auditor` segue versionado em `.claude/agents/lgpd-auditor.md` e é executado **sob
# demanda pelo Claude Code**, localmente, quando alguém pede — em vez de uma sessão de
# agente cobrada em créditos de API a cada pull request, quase sempre para concluir que a
# mudança não afeta dado pessoal. O que se perde é o disparo por conta própria; o que se
# ganha é rodar quando a mudança de fato mexe com dado pessoal, com a conversa junto e sem
# arrastar o diff para uma API de terceiro (a OpenAI deixa de ser operadora sobre o diff).
#
# O serviço do Render é o ambiente de HOMOLOG. Produção passou a existir no Fly.io
# (docs/producao-whatsapp.md §9b): para medi-la, acrescente um job igual ao `ambiente`
# apontando para `PRODUCAO_BASE_URL` e com `--estrito` — em homolog o modo é observação,
# para não travar a esteira. Feito isso, decida também se ele volta a ter gatilho; hoje,
# por decisão do responsável, nada de LGPD roda sozinho.

on:
  # Manual, e só. Ver o cabeçalho: nada de LGPD dispara sozinho neste repositório.
  workflow_dispatch:

concurrency:
  group: lgpd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ambiente:
    name: Postura do ambiente (homolog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A espera de 10 min pelo deploy do Render saiu junto com o gatilho por push: sem
      # push, não há deploy subindo para esperar. Quem roda à mão roda quando quer, e
      # ficam só 3 tentativas para o caso de o serviço estar hibernando.
      - name: Confere que o ambiente responde
        env:
          BASE_URL: ${{ vars.HOMOLOG_BASE_URL }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "::warning::variável HOMOLOG_BASE_URL não definida — verificação pulada."
            {
              echo "### ⚠️ Postura do ambiente não foi medida"
              echo
              echo "A variável \`HOMOLOG_BASE_URL\` não está definida."
              echo "Cadastre em **Settings → Secrets and variables → Actions → Variables**."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for i in 1 2 3; do
            if curl -fsS --max-time 10 "$BASE_URL/health" > /dev/null; then
              echo "Ambiente respondendo (tentativa $i)."
              exit 0
            fi
            sleep 10
          done
          echo "::warning::/health não respondeu; seguindo assim mesmo."

      - name: Verifica a postura de proteção de dados
        env:
          BASE_URL: ${{ vars.HOMOLOG_BASE_URL }}
        run: |
          if [ -z "$BASE_URL" ]; then exit 0; fi
          # Sem --estrito: homolog relata e não reprova. Em produção, acrescente
          # --estrito para que uma regressão de configuração falhe o job.
          python scripts/postura_ambiente.py "$BASE_URL" \
            --ambiente homolog \
            --json postura.json | tee "$GITHUB_STEP_SUMMARY"

      - name: Guarda o resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postura-homolog
          path: postura.json
          if-no-files-found: ignore
