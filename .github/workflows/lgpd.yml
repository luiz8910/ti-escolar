name: LGPD — postura dos ambientes (agenda)

# Este workflow mede **configuração**, e só isso. O código é o mesmo em todo ambiente; o que
# muda é a CONFIGURAÇÃO, e ela muda por fora do git — alguém edita uma env var no painel do
# Render, roda um `fly secrets set`, e nenhum commit registra. É determinístico, sem LLM e
# sem credencial (`scripts/postura_ambiente.py`): custo zero e resultado repetível.
#
# **A medição a cada deploy não mora mais aqui** (02/set/2026). Ela virou o job `postura`
# das próprias esteiras — `deploy-homolog.yml` e `deploy-producao.yml` —, que já sabem
# quando o ambiente terminou de subir e qual commit está no ar. O que sobra aqui é a
# **agenda**: uma configuração pode mudar no painel do provedor numa terça sem nenhum
# deploy acontecer, e checar só no deploy deixaria essa janela aberta.
#
# **A auditoria do código por LLM não mora aqui** (13/ago/2026). O agente `lgpd-auditor`
# segue versionado em `.claude/agents/lgpd-auditor.md` e é executado **sob demanda pelo
# Claude Code**, localmente, quando alguém pede — em vez de uma sessão de agente cobrada em
# créditos de API a cada pull request, quase sempre para concluir que a mudança não afeta
# dado pessoal. O que se perde é o disparo por conta própria; o que se ganha é rodar quando
# a mudança de fato mexe com dado pessoal, com a conversa junto e sem arrastar o diff para
# uma API de terceiro (a OpenAI deixa de ser operadora sobre o diff).

on:
  workflow_dispatch:
  schedule:
    # Segunda, 09:00 BRT.
    - cron: "0 12 * * 1"

permissions:
  contents: read

jobs:
  homolog:
    uses: ./.github/workflows/postura.yml
    with:
      ambiente: homolog
      base_url: ${{ vars.HOMOLOG_BASE_URL }}
      # Observação: homolog é onde a configuração ainda está sendo ajustada.
      estrito: false

  producao:
    uses: ./.github/workflows/postura.yml
    with:
      ambiente: producao
      base_url: ${{ vars.PRODUCAO_BASE_URL }}
      # Estrito: aqui uma regressão de configuração é incidente, e o e-mail de workflow
      # falhado é o único aviso que chega sem alguém ir olhar.
      estrito: true
