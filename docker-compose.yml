services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tiescolar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tiescolar}
      POSTGRES_DB: ${POSTGRES_DB:-tiescolar}
    ports:
      # Porta do host configurável (DB_PORT) para rodar worktrees em paralelo;
      # 5433 (default) evita conflito com um Postgres local já em execução.
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tiescolar} -d ${POSTGRES_DB:-tiescolar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://tiescolar:tiescolar@db:5432/tiescolar}
      # O compose é o ambiente local descartável: aqui o seed de demonstração é o que
      # se quer. Em produção o CMD do Dockerfile roda só o bootstrap.
      APP_ENV: ${APP_ENV:-development}
      SEED_DEMO: ${SEED_DEMO:-true}
    ports:
      # Porta do host configurável (BACKEND_PORT) para rodar worktrees em paralelo.
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    # Aplica migrations, provisiona o super admin, faz o seed de demonstração (só roda
    # com SEED_DEMO=true fora de produção) e sobe a API com reload.
    command: >
      sh -c "alembic upgrade head &&
             python -m app.bootstrap &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # S3 local, para o adaptador rodar contra um serviço S3 **de verdade** — não um mock.
  # Foi a falta disso que deixou o adaptador de object storage sem sair do papel por meses
  # (§0.6 do plano de 10/08). Console em http://localhost:9001 (minioadmin/minioadmin).
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ./web
    environment:
      # No browser usamos localhost; o backend é exposto na porta BACKEND_PORT do host.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      # Porta do host configurável (WEB_PORT) para rodar worktrees em paralelo.
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - backend
    volumes:
      - ./web:/app
      - /app/node_modules

volumes:
  pgdata:
