[project]
name = "ti-escolar-backend"
version = "0.1.0"
description = "Back-end do TI-Escolar (FastAPI, arquitetura hexagonal, Postgres + pgvector)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "alembic>=1.13",
    "httpx>=0.27",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    # Teto proposital: o CI instala o linter a cada execução, então uma versão
    # nova do ruff quebra a build sem que uma linha do projeto tenha mudado.
    # Foi o que houve com a 0.16.0, que passou a acusar 424 erros — 358 deles
    # B008 (`Depends()` como default de argumento), que é justamente o idioma
    # de injeção de dependência do FastAPI. Antes de subir o teto, avalie as
    # regras novas e ajuste `[tool.ruff.lint]` na mesma mudança.
    "ruff>=0.5,<0.16",
]
llm = [
    "anthropic>=0.39",
]
# Extra próprio, e não dependência base: quem roda com ARQUIVO_STORAGE=postgres (o default,
# e o docker-compose de desenvolvimento) não precisa carregar o botocore, que é grande.
# A fábrica importa o adaptador só quando o storage efetivo é "s3".
s3 = [
    "boto3>=1.34",
]
# Alerta ativo de falha. Extra próprio: quem roda sem SENTRY_DSN (desenvolvimento, ou
# quem não quer o subprocessador) não precisa do pacote.
obs = [
    "sentry-sdk[fastapi]>=2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
